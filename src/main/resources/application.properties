spring.application.name=rendez-vous
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/rendezvous
spring.datasource.username=appuser
spring.datasource.password=StrongPass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/rendezvous
